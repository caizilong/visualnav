project_name: nomad
run_name: nomad

# training setup
use_wandb: False # epoch metrics are still saved locally without W&B
train: True
batch_size: 128
eval_batch_size: 64 # optional override; defaults to batch_size
epochs: 100
gpu_ids: [0]
num_workers: 12
lr: 5e-5
optimizer: adamw
clipping: False
max_norm: 1.
scheduler: "cosine"
warmup: True 
warmup_epochs: 4
cyclic_period: 10
plateau_patience: 3
plateau_factor: 0.5
seed: 0

# model params
model_type: nomad
vision_encoder: nomad_vint
encoding_size: 256
obs_encoder: efficientnet-b0
attn_unet: False
cond_predict_scale: False
mha_num_attention_heads: 4
mha_num_attention_layers: 4
mha_ff_dim_factor: 4
down_dims: [64, 128, 256]

# diffusion model params
num_diffusion_iters: 10

# mask 
goal_mask_prob: 0.5

# normalization for the action space
normalize: True

# context
context_type: temporal
context_size: 3 # 5
alpha: 1e-4

# distance bounds for distance and action and distance predictions 
distance:
  min_dist_cat: 0
  max_dist_cat: 20
action:
  min_dist_cat: 3
  max_dist_cat: 20

# action output params
len_traj_pred: 8
learn_angle: False

# dataset specific parameters
image_size: [96, 96] # width, height
datasets:
  recon:
    data_folder: /home/czl/visualnav/datasets/recon
    train: /home/czl/visualnav/train/vint_train/data/data_splits/recon/train/ # path to train folder with traj_names.txt
    test: /home/czl/visualnav/train/vint_train/data/data_splits/recon/test/ # path to test folder with traj_names.txt
    end_slack: 3 # because many trajectories end in collisions
    goals_per_obs: 1 # how many goals are sampled per observation
    negative_mining: True # negative mining from the ViNG paper (Shah et al.)
  go_stanford:
    data_folder: /home/czl/visualnav/datasets/go_stanford
    train: /home/czl/visualnav/train/vint_train/data/data_splits/go_stanford/train/
    test: /home/czl/visualnav/train/vint_train/data/data_splits/go_stanford/test/
    end_slack: 0
    goals_per_obs: 2 # increase dataset size
    negative_mining: True
  cory_hall:
    data_folder: /home/czl/visualnav/datasets/cory_hall/
    train: /home/czl/visualnav/train/vint_train/data/data_splits/cory_hall/train/
    test: /home/czl/visualnav/train/vint_train/data/data_splits/cory_hall/test/
    end_slack: 3 # because many trajectories end in collisions
    goals_per_obs: 1
    negative_mining: True
  # tartan_drive:
  #   data_folder: /home/<username>/nomad_dataset/tartan_drive/
  #   train: /home/<username>/data_splits/tartan_drive/train/
  #   test: /home/<username>/data_splits/tartan_drive/test/
  #   end_slack: 3 # because many trajectories end in collisions
  #   goals_per_obs: 1
  #   negative_mining: True
  # sacson:
  #   data_folder: /home/<username>/nomad_dataset/sacson/
  #   train: /home/<username>/data_splits/sacson/train/
  #   test: /home/<username>/data_splits/sacson/test/
  #   end_slack: 3 # because many trajectories end in collisions
  #   goals_per_obs: 1
  #   negative_mining: True
  # private datasets (uncomment if you have access)
  seattle:
    data_folder: /home/czl/visualnav/datasets/seattle/
    train: /home/czl/visualnav/train/vint_train/data/data_splits/seattle/train/
    test: /home/czl/visualnav/train/vint_train/data/data_splits/seattle/test/
    end_slack: 0
    goals_per_obs: 1
    negative_mining: True
  scand:
    data_folder: /home/czl/visualnav/datasets/scand/
    train: /home/czl/visualnav/train/vint_train/data/data_splits/scand/train/
    test: /home/czl/visualnav/train/vint_train/data/data_splits/scand/test/
    end_slack: 0
    goals_per_obs: 1
    negative_mining: True

# logging stuff
## =0 turns off
print_log_freq: 500 # in iterations
image_log_freq: 10000 #0 # in iterations
num_images_log: 2 #0 
pairwise_test_freq: 0 # in epochs
eval_fraction: 0.25
wandb_log_freq: 10 # in iterations
eval_freq: 1 # in epochs

# With both modules disabled, use the datasets and training settings above.
# Set training_profile: habitat_scratch to train the Habitat baseline with both disabled.
# Enabling either module or passing a Habitat ablation flag selects habitat_scratch.
habitat_training:
  initialization: scratch
  project_name: nomad_habitat
  run_name: scratch
  datasets: {}
  scheduler: linear_warmup_cosine
  num_workers: 4
  weight_decay: 0.01
  batch_size: 4
  relation_batch_size: 4
  eval_batch_size: 4
  gradient_accumulation_steps: 4
  amp: true
  activation_checkpointing: false
  print_log_freq: 50
  checkpoint_every: 10
  eval_sampling_batches: 1
  eval_action_samples: 4
  eval_fraction: 1.0

simulation:
  manifest: ../datasets/habitat/manifest.json
  action_statistics: ../datasets/habitat/action_stats.json
  trajectory_region_statistics: ../datasets/habitat/trajectory_region_statistics.json
  # cache_dir: /data/habitat/nomad_cache

spatial_bottleneck:
  enabled: false
  mode: bottleneck  # auxiliary removes feedback, but keeps the same auxiliary task.
  representation: query_tokens  # CLI also provides global_condition / pooled_spatial controls.
  fusion: shared
  num_sectors: 6
  num_radial_bins: 4
  token_dim: 64
  num_attention_heads: 4
  lambda_visitation: 0.1  # Initial weight; tune only using train/validation data.
  stationary_epsilon_m: 0.0001  # Numerical dead zone for undefined bearings.
  max_fit_points: 200000
  fit_seed: 0  # Shared across training seeds, so spatial bins remain identical.
  prior_smoothing_mass: 0.0001  # Fixed before validation; prevents log(0) for unseen bins.
  # discretization and its statistics fingerprint are loaded from trajectory_region_statistics.

goal_relation:
  enabled: false
  hidden_dims: [128, 64]
  lambda_reach: 1.0
  lambda_distance: 1.0
  lambda_start: 0.1
  lambda_end: 1.0
  warmup_steps: 500
  distance_beta: 0.1
  selector:
    max_forward_skip: 2
    use_distance: true
    close_threshold: 3.0
    radius: 4
  runtime:
    max_rejections: 3
    rejection_timeout_s: 2.0
    stale_timeout_s: 2.0
