# Initial recipe, not a measured memory/time or performance guarantee.
training_profile: habitat_scratch
project_name: nomad_habitat
run_name: scratch
use_wandb: false
train: true
seed: 0
gpu_ids: [0]
num_workers: 4
epochs: 100
optimizer: adamw
scheduler: linear_warmup_cosine
lr: 5.0e-5
weight_decay: 0.01
warmup_epochs: 4
batch_size: 4
relation_batch_size: 4
eval_batch_size: 4
gradient_accumulation_steps: 4
amp: true
activation_checkpointing: false
max_norm: 1.0
clipping: false  # No per-parameter clipping hooks in this profile.
print_log_freq: 50
gradient_probe_every: 200
checkpoint_every: 10  # latest is saved every epoch; 0 disables intermediate archives.
eval_sampling_batches: 1
eval_action_samples: 4
eval_fraction: 1.0

model_type: nomad
vision_encoder: nomad_vint
encoding_size: 256
obs_encoder: efficientnet-b0
cond_predict_scale: false
mha_num_attention_heads: 4
mha_num_attention_layers: 4
mha_ff_dim_factor: 4
down_dims: [64, 128, 256]
num_diffusion_iters: 10
image_size: [96, 96]  # width, height
context_type: temporal
context_size: 3
goal_type: image
normalize: true
learn_angle: false
len_traj_pred: 8
goal_mask_prob: 0.5
alpha: 0.0001
distance: {min_dist_cat: 0, max_dist_cat: 20}
action: {min_dist_cat: 3, max_dist_cat: 20}
datasets: {}  # Public navigation datasets are prohibited in this profile.

simulation:
  manifest: ../datasets/habitat/manifest.json
  action_statistics: ../datasets/habitat/action_stats.json
  # Optional shared FP32 image-cache root. Defaults to <manifest-dir>/.nomad_cache.
  # cache_dir: /data/habitat/nomad_cache

# H, action bounds, physical scale and sampling interval are read from the
# validated manifest/statistics, then written into resolved_config.yaml + v2.
# No load_run/pretrained_checkpoint/init_from. --resume accepts complete v2 only.
r3:
  enabled: true
  hidden_dims: [128, 64]
  lambda_reach: 1.0
  lambda_distance: 1.0
  lambda_start: 0.1
  lambda_end: 1.0
  warmup_steps: 500
  distance_beta: 0.1
  selector:
    max_forward_skip: 2
    use_distance: true
    close_threshold: 3.0  # Original temporal distance, not meters.
    radius: 4
  runtime:
    max_rejections: 3
    rejection_timeout_s: 2.0
    stale_timeout_s: 2.0
